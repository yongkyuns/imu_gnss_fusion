name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os_name }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: macOS
            runs_on: macos-latest
          - os_name: Linux
            runs_on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Check key sim binaries
        run: cargo check -p sim --bins --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Document workspace
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            mobile/ios/SensorFusionFFI

      - name: Test iOS FFI crate
        run: cargo test --manifest-path mobile/ios/SensorFusionFFI/Cargo.toml --locked

      - name: Build SensorFusionFFI XCFramework
        run: mobile/ios/scripts/build_sensor_fusion_xcframework.sh

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project mobile/ios/IMUGNSSPhone/IMUGNSSPhone.xcodeproj \
            -scheme IMUGNSSPhone \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test iOS app
        run: |
          xcodebuild test \
            -project mobile/ios/IMUGNSSPhone/IMUGNSSPhone.xcodeproj \
            -scheme IMUGNSSPhone \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:IMUGNSSPhoneTests \
            CODE_SIGNING_ALLOWED=NO

  hosted-generic-datasets:
    name: Hosted generic datasets
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache hosted generic datasets
        uses: actions/cache@v4
        with:
          path: .cache/generic-datasets
          key: generic-datasets-${{ hashFiles('.github/datasets/**') }}
          restore-keys: |
            generic-datasets-

      - name: Validate manifest, checksums, schema, and smoke profile
        run: |
          node scripts/validate_generic_datasets.mjs \
            --manifest .github/datasets/generic-datasets.json \
            --cache-dir .cache/generic-datasets \
            --work-dir target/generic-datasets \
            --smoke-profile

  web-pages-artifact:
    name: Web Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.118 --locked

      - name: Install docs dependencies
        run: |
          python -m pip install -r docs/requirements.txt
          npm ci

      - name: Test scripts and docs config
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          npm test

      - name: Render ELK diagrams
        run: npm run render:elk-diagrams

      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs target/docs-html

      - name: Assemble Pages artifact
        run: |
          rm -rf target/pages-site
          mkdir -p target/pages-site
          rsync -a \
            --exclude local-config.js \
            --exclude pkg/ \
            --exclude docs/ \
            web/ target/pages-site/
          cargo build -p sim --bin visualizer --release --target wasm32-unknown-unknown --locked
          wasm-bindgen \
            --target web \
            --out-dir target/pages-site/pkg \
            target/wasm32-unknown-unknown/release/visualizer.wasm
          mkdir -p target/pages-site/docs
          rsync -a target/docs-html/ target/pages-site/docs/
          touch target/pages-site/.nojekyll

      - name: Validate Pages static artifact
        run: node scripts/validate_pages_static.mjs --site-dir target/pages-site --require-wasm --require-docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages-site

  deploy-pages:
    name: Deploy GitHub Pages
    needs: [rust, ios, hosted-generic-datasets, web-pages-artifact]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
