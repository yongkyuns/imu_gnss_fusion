<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Pages artifact layout</title>
  <desc id="desc">Diagram showing web files, wasm package, hosted datasets, and Sphinx docs assembled into target/pages-site.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#4973a6"/>
    </marker>
    <style>
      .bg { fill: #f7fbff; }
      .title { fill: #182437; font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { fill: #ffffff; stroke: #c8d8ee; stroke-width: 1.5; }
      .dest { fill: #0b1220; stroke: #375479; stroke-width: 1.5; }
      .label { fill: #1b2b42; font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #52657f; font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .dest-label { fill: #f2f7ff; font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .dest-small { fill: #c3d4ed; font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #648abd; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .folder { fill: #e9f2ff; stroke: #bad0ee; stroke-width: 1; }
      .folder-text { fill: #38506f; font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <rect class="bg" width="1180" height="520"/>
  <text class="title" x="56" y="58">GitHub Pages Artifact</text>

  <rect class="card" x="56" y="105" width="220" height="120" rx="14"/>
  <text class="label" x="86" y="148">web/</text>
  <text class="small" x="86" y="180">index.html</text>
  <text class="small" x="86" y="205">datasets/</text>

  <rect class="card" x="56" y="270" width="220" height="120" rx="14"/>
  <text class="label" x="86" y="313">visualizer.wasm</text>
  <text class="small" x="86" y="345">wasm-bindgen output</text>
  <text class="small" x="86" y="370">pkg/</text>

  <rect class="card" x="365" y="188" width="220" height="120" rx="14"/>
  <text class="label" x="395" y="231">Sphinx build</text>
  <text class="small" x="395" y="263">docs/ source</text>
  <text class="small" x="395" y="288">target/docs-html</text>

  <rect class="dest" x="720" y="95" width="380" height="315" rx="18"/>
  <text class="dest-label" x="760" y="140">target/pages-site/</text>
  <rect class="folder" x="760" y="170" width="128" height="34" rx="8"/>
  <text class="folder-text" x="790" y="192">index.html</text>
  <rect class="folder" x="760" y="220" width="128" height="34" rx="8"/>
  <text class="folder-text" x="808" y="242">pkg/</text>
  <rect class="folder" x="760" y="270" width="128" height="34" rx="8"/>
  <text class="folder-text" x="790" y="292">datasets/</text>
  <rect class="folder" x="760" y="320" width="128" height="34" rx="8"/>
  <text class="folder-text" x="807" y="342">docs/</text>
  <text class="dest-small" x="930" y="192">visualizer root</text>
  <text class="dest-small" x="930" y="242">wasm bundle</text>
  <text class="dest-small" x="930" y="292">hosted replay data</text>
  <text class="dest-small" x="930" y="342">Sphinx documentation</text>

  <path class="arrow" d="M276 165 C420 165 560 176 720 198"/>
  <path class="arrow" d="M276 330 C430 330 570 255 720 238"/>
  <path class="arrow" d="M585 248 C635 248 650 326 720 337"/>
</svg>
